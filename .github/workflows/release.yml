name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  # Generate changelog from conventional commits
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.generate.outputs.notes }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate changelog notes
        id: generate
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            # No previous tag, get all commits
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" --no-merges)
          fi

          # Parse conventional commits
          FEATURES=$(echo "$COMMITS" | grep "^feat:" | sed 's/^feat:/- /' || true)
          FIXES=$(echo "$COMMITS" | grep "^fix:" | sed 's/^fix:/- /' || true)
          DOCS=$(echo "$COMMITS" | grep "^docs:" | sed 's/^docs:/- /' || true)
          PERF=$(echo "$COMMITS" | grep "^perf:" | sed 's/^perf:/- /' || true)
          REFACTOR=$(echo "$COMMITS" | grep "^refactor:" | sed 's/^refactor:/- /' || true)
          TEST=$(echo "$COMMITS" | grep "^test:" | sed 's/^test:/- /' || true)

          # Build release notes
          NOTES=""
          if [ -n "$FEATURES" ]; then
            NOTES="$NOTES## Features\n\n$FEATURES\n\n"
          fi
          if [ -n "$FIXES" ]; then
            NOTES="$NOTES## Bug Fixes\n\n$FIXES\n\n"
          fi
          if [ -n "$PERF" ]; then
            NOTES="$NOTES## Performance\n\n$PERF\n\n"
          fi
          if [ -n "$REFACTOR" ]; then
            NOTES="$NOTES## Refactoring\n\n$REFACTOR\n\n"
          fi
          if [ -n "$DOCS" ]; then
            NOTES="$NOTES## Documentation\n\n$DOCS\n\n"
          fi
          if [ -n "$TEST" ]; then
            NOTES="$NOTES## Testing\n\n$TEST\n\n"
          fi

          # Escape for GitHub Actions
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"

          echo "notes=$NOTES" >> $GITHUB_OUTPUT

  # Build binaries for multiple platforms
  build-binaries:
    name: Build Binaries
    needs: changelog
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Targets are limited to platforms we can build natively with system
      # libraries (chafa/glib/alsa/openssl). Cross-compiled targets
      # (musl, linux-aarch64, mac x86_64) need those C libs built per-target
      # and are tracked in issue #33.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libchafa-dev libglib2.0-dev libasound2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkgconf chafa openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          BINARY="target/${{ matrix.target }}/release/joshify"
          if [ -f "$BINARY.exe" ]; then
            BINARY="$BINARY.exe"
          fi
          cp "$BINARY" "dist/joshify-${{ matrix.name }}"
          cd dist
          tar czf "joshify-${{ matrix.name }}.tar.gz" "joshify-${{ matrix.name }}"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: joshify-${{ matrix.name }}
          path: dist/joshify-${{ matrix.name }}.tar.gz

  # Create GitHub Release
  release:
    name: Create Release
    needs: [changelog, build-binaries]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      # install.sh verifies downloads against this file and refuses to install
      # a tarball whose hash does not match.
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Joshify v${{ needs.changelog.outputs.version }}
          body: ${{ needs.changelog.outputs.release_notes }}
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release (main branch)
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build (Development)
          body: |
            This is the latest development build from the main branch.

            **Version:** ${{ needs.changelog.outputs.version }}

            These binaries are built from the latest commit on main and may contain unreleased features or fixes.
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Verify the README badges reflect the release. All badges are live
  # shields.io endpoints, so nothing needs rewriting — but they must actually
  # resolve, and the release badge must catch up to the new tag.
  verify-badges:
    name: Verify README Badges
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check badges and README media
        run: scripts/check-badges.sh --expect-release "${GITHUB_REF#refs/tags/}"
